<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample Tax Check</title>
<style>
:root{
  --bg:#ffffff; --card:#f4f6f9; --ink:#1a2233; --muted:#5a6476; --line:#dde3ec;
  --headerbg:#001740; --heading:#001740; --blue:#005493; --onblue:#ffffff;
  --gold:#f5ac03; --ok:#1d6b43; --okbg:#e6f3eb; --warn:#8a5a00; --warnbg:#fff3d6; --stop:#a8231b; --stopbg:#fce6e4;
  --chip:#e3edf7; --focus:#005493; --inputbg:#ffffff;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1422; --card:#172131; --ink:#e6ebf3; --muted:#a2adc0; --line:#2a3548;
    --headerbg:#071a3a; --heading:#cfe0f5; --blue:#4c9be0; --onblue:#06121f;
    --gold:#f5ac03; --ok:#7fd3a3; --okbg:#143023; --warn:#f3c463; --warnbg:#33280d; --stop:#f19a92; --stopbg:#3a1714;
    --chip:#1d2b40; --focus:#7db8ee; --inputbg:#0f1828; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1422; --card:#172131; --ink:#e6ebf3; --muted:#a2adc0; --line:#2a3548;
  --headerbg:#071a3a; --heading:#cfe0f5; --blue:#4c9be0; --onblue:#06121f;
  --gold:#f5ac03; --ok:#7fd3a3; --okbg:#143023; --warn:#f3c463; --warnbg:#33280d; --stop:#f19a92; --stopbg:#3a1714;
  --chip:#1d2b40; --focus:#7db8ee; --inputbg:#0f1828; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
header.top{background:var(--headerbg);color:#fff;padding:20px 20px 18px}
header.top .wrap{max-width:800px;margin:0 auto;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
header.top h1{font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:1.35rem;margin:0 0 4px;font-weight:700}
header.top p{margin:0;opacity:.85;font-size:.98rem;max-width:560px}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang button{background:transparent;color:#fff;border:0;font:inherit;font-weight:700;padding:6px 12px;cursor:pointer}
.lang button.on{background:#fff;color:#001740}
main{max-width:800px;margin:0 auto;padding:20px 16px 48px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 18px}
.progress span{display:block;height:100%;background:var(--blue);width:0;transition:width .25s ease}
.side{font-size:.92rem;color:var(--blue);font-weight:700;margin:0 0 6px}
.qcard{background:var(--card);border-radius:10px;padding:22px 20px}
.qcard h2{font-family:Arial,Helvetica,sans-serif;color:var(--heading);font-size:1.22rem;line-height:1.3;margin:0 0 10px;font-weight:700}
.help{color:var(--muted);font-size:.95rem;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px 15px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.lang button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt strong{display:block;font-weight:700}
.opt span{display:block;color:var(--muted);font-size:.93rem;margin-top:2px}
.opt.sel{border-color:var(--blue);background:var(--chip)}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow label{display:flex;align-items:center;gap:8px;background:var(--inputbg);border:1.5px solid var(--line);border-radius:8px;padding:0 12px}
.numrow input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.15rem;padding:11px 0;width:160px}
.numrow input:focus{outline:none}
.err{color:var(--stop);font-size:.93rem;margin-top:8px;min-height:1.2em}
.nav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--blue);background:var(--blue);color:var(--onblue);font-weight:700}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:default}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.vt{background:var(--card);border-radius:10px;padding:14px;border-top:4px solid var(--blue)}
.vt.gold{border-top-color:var(--gold)}
.vt small{display:block;color:var(--muted);font-size:.88rem}
.vt b{display:block;font-family:Arial,Helvetica,sans-serif;font-size:1.04rem;color:var(--heading);margin-top:3px;line-height:1.3}
.alert{border-radius:8px;padding:12px 14px;margin:0 0 10px;font-size:.98rem}
.alert.stop{background:var(--stopbg);color:var(--stop)}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.info{background:var(--chip);color:var(--ink)}
.alert b{display:block}
section.block{background:var(--card);border-radius:10px;padding:18px 18px 14px;margin:0 0 14px}
section.block h3{font-family:Arial,Helvetica,sans-serif;color:var(--heading);font-size:1.08rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.93rem}
.fact i{font-style:normal;color:var(--muted)}
.todo{margin:0 0 10px;padding:0;list-style:none}
.todo li{position:relative;padding-left:20px;margin:0 0 7px}
.todo li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.inv{background:var(--bg);border-left:4px solid var(--blue);border-radius:4px;padding:10px 12px;font-size:.95rem;margin:4px 0 12px}
.inv small{display:block;color:var(--muted);font-size:.85rem;margin-bottom:2px}
.euro{background:var(--bg);border-left:4px solid var(--gold);border-radius:4px;padding:10px 12px;font-size:.95rem;margin:0 0 10px}
.euro b{color:var(--heading)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:.95rem}
details ul{margin:8px 0 2px;padding-left:20px;font-size:.92rem;color:var(--muted)}
details li{margin-bottom:4px}
.tbl-wrap{overflow-x:auto}
table.econ{border-collapse:collapse;width:100%;font-size:.97rem;margin:0 0 12px}
table.econ td{padding:5px 8px;vertical-align:top}
table.econ td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.econ tr.total td{font-weight:700;border-top:1.5px solid var(--ink)}
table.econ tr.hl td{background:var(--chip)}
table.econ tr.sub td{color:var(--muted);font-size:.9rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.party b{display:block;color:var(--heading);margin-bottom:4px;font-family:Arial,Helvetica,sans-serif}
.tpl{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.tpl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.tpl-h b{color:var(--heading)}
.tpl pre{white-space:pre-wrap;font-family:inherit;font-size:.93rem;margin:0;color:var(--ink)}
.answers{font-size:.93rem;margin:0;padding:0;list-style:none}
.answers li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.answers li span:last-child{font-weight:700;text-align:right}
.foot{color:var(--muted);font-size:.88rem;margin-top:18px}
.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.docgrid label{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}
.docgrid input{font:inherit;color:var(--ink);background:var(--inputbg);border:1.5px solid var(--line);border-radius:6px;padding:7px 9px}
section.final{border:2px solid var(--headerbg);border-radius:10px;margin:0 0 14px;overflow:hidden}
section.final h3{margin:0;background:var(--headerbg);color:#fff;font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:1.15rem;padding:12px 18px}
.tg{padding:12px 18px 4px}
.tg+.tg{border-top:1px solid var(--line)}
.tgh{margin:0 0 6px;font-weight:700;color:var(--blue)}
.tg.stop .tgh{color:var(--stop)}
.tg ul{list-style:none;margin:0;padding:0}
.tg li{margin:0 0 9px}
.tg label{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;cursor:pointer;font-size:1.02rem}
.tg input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue)}
.tg .n{font-weight:700;color:var(--muted);min-width:1.4em;text-align:right}
.tg input:checked ~ span:last-child{text-decoration:line-through;color:var(--muted)}
@media (max-width:620px){.docgrid{grid-template-columns:1fr}}
.copied{color:var(--ok);font-weight:700;font-size:.93rem}
@media (max-width:620px){ .verdicts,.cols{grid-template-columns:1fr} body{font-size:16px} header.top .wrap{flex-direction:column} }
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
@media print{.nav,.progress,.lang{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1 id="h1"></h1><p id="sub"></p></div>
  <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="de">DE</button></div>
</div></header>
<main>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
/* ---------- settings & language ---------- */
let LANG='en'; const SET={tax:30, base:'ontop'};
try{ const l=localStorage.getItem('sic_lang'); if(l==='de'||l==='en') LANG=l; }catch(e){}
const save=()=>{ try{ localStorage.setItem('sic_lang',LANG); }catch(e){} };
const L=(en,de)=>LANG==='de'?de:en;
const t=x=>Array.isArray(x)?x[LANG==='de'?1:0]:x;
const num=v=>{ const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(x)?0:x; };
let CUR='EUR';
const fmt=n=>new Intl.NumberFormat(LANG==='de'?'de-DE':(CUR==='GBP'?'en-GB':'en-IE'),{style:'currency',currency:CUR}).format(Math.round(n*100)/100);

/* ---------- questions ---------- */
const DE_=a=>a.entity==='de', UK_=a=>a.entity==='uk', OK_=a=>DE_(a)||UK_(a);
const EXT=['creator','media','agency'];
const ext=a=>EXT.includes(a.rtype);
const brandQ=a=>OK_(a)&&!!a.rtype&&a.rtype!=='ic';
const pays=a=>a.who==='invoice'||a.who==='credit';
const svc=a=>a.who==='invoice'||(a.who==='credit'&&a.cnType!=='discount');
const extGo=a=>OK_(a)&&ext(a)&&!(UK_(a)&&a.rloc==='nonuk')&&!!a.rloc;
const locOpts=a=>UK_(a)
  ? [{v:'home',l:['United Kingdom','Vereinigtes Königreich']},{v:'nonuk',l:['Outside the UK','Außerhalb UK']}]
  : [{v:'home',l:['Germany','Deutschland']},{v:'eu',l:['Another EU country','Anderes EU-Land'],d:['e.g. Austria, Netherlands, France, Poland','z. B. Österreich, Niederlande, Frankreich, Polen']},{v:'noneu',l:['Outside the EU','Außerhalb der EU'],d:['e.g. Switzerland, UK, USA, Taiwan, China','z. B. Schweiz, UK, USA, Taiwan, China']}];
const YN=[{v:'yes',l:['Yes','Ja']},{v:'no',l:['No','Nein']}];

const Q=[
 {id:'entity',side:['General','Allgemein'],text:['Which PGG company ships the sample?','Welche PGG-Gesellschaft versendet das Sample?'],
  help:['VAT rules differ by country.','Die Umsatzsteuerregeln sind je Land unterschiedlich.'],
  opts:[{v:'de',l:['A German company','Eine deutsche Gesellschaft'],d:['e.g. Caseking','z. B. Caseking']},
        {v:'uk',l:['A UK company','Eine UK-Gesellschaft'],d:['UK rules','UK-Regeln']},
        {v:'other',l:['Another company','Eine andere Gesellschaft'],d:['e.g. Jimm’s, PCCG, CK Iberia, CK Hungary, PGW','z. B. Jimm’s, PCCG, CK Iberia, CK Hungary, PGW']}]},
 {id:'value',side:['General','Allgemein'],type:'num',show:OK_,text:['What is the product worth?','Was ist das Produkt wert?'],
  help:['Our net purchase price (excl. VAT) from the ERP – not 0.01 and not the retail price.','Unser Netto-Einkaufspreis (ohne USt) aus dem ERP – nicht 0,01 und nicht der Verkaufspreis.']},
 {id:'rtype',side:['General','Allgemein'],show:OK_,text:['Who receives the product?','Wer erhält das Produkt?'],
  opts:[{v:'creator',l:['Influencer, streamer or content creator','Influencer, Streamer oder Content Creator']},
        {v:'media',l:['Media outlet or tech site','Medium oder Tech-Portal'],d:['A company, e.g. magazine or channel run as a business','Ein Unternehmen, z. B. Magazin oder gewerblicher Kanal']},
        {v:'agency',l:['Agency or management','Agentur oder Management'],d:['We deal with the agency; the product goes to their creator','Vertragspartner ist die Agentur; das Produkt geht an ihren Creator']},
        {v:'consumer',l:['End customers','Endkunden'],d:['Giveaway, raffle or event prize','Gewinnspiel, Verlosung oder Event-Preis']},
        {v:'own',l:['We use it ourselves','Eigene Nutzung'],d:['Demo, display, event booth, testing or system integration','Demo, Ausstellung, Messestand, Test oder Systemintegration']},
        {v:'staff',l:['An employee','Ein Mitarbeiter'],d:['Keeps it or uses it privately','Behält es oder nutzt es privat']},
        {v:'ic',l:['Another PGG company','Eine andere PGG-Gesellschaft'],d:['Intercompany sample exchange','Intercompany-Sample-Austausch']}]},

 {id:'who',side:['Brand side','Brand-Seite'],show:brandQ,text:['Who pays for this sample?','Wer bezahlt dieses Sample?'],
  opts:[{v:'invoice',l:['The brand pays – we invoice the brand','Die Brand zahlt – wir stellen eine Rechnung']},
        {v:'credit',l:['The brand pays – via credit note or deduction','Die Brand zahlt – per Gutschrift oder Verrechnung'],d:['The brand issues a credit note or deducts it from what we owe','Die Brand stellt eine Gutschrift aus oder verrechnet mit unseren Verbindlichkeiten']},
        {v:'free',l:['The brand gave us the product for free','Die Brand hat das Produkt kostenlos gestellt'],d:['Free sample stock','Kostenloser Sample-Bestand']},
        {v:'pgg',l:['PGG pays from its own budget','PGG zahlt aus eigenem Budget'],d:['Product from our regular stock, nobody reimburses us','Ware aus unserem Bestand, niemand erstattet sie']}]},
 {id:'confirm',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&pays(a),text:['Do we have the brand’s written confirmation before shipping?','Liegt die schriftliche Bestätigung der Brand vor dem Versand vor?'],
  help:['A PO, an email or a framework agreement with a seeding budget.','Eine PO, E-Mail oder Rahmenvereinbarung mit Seeding-Budget.'],
  opts:[{v:'yes',l:['Yes','Ja'],d:['PO, email or framework agreement','PO, E-Mail oder Rahmenvereinbarung']},
        {v:'adhoc',l:['Not yet – it has to ship now (ad-hoc)','Noch nicht – muss sofort raus (ad-hoc)'],d:['e.g. launch date or review embargo','z. B. Launch-Termin oder Review-Embargo']},
        {v:'no',l:['No – it can wait','Nein – es kann warten']}]},
 {id:'fee',side:['Brand side','Brand-Seite'],type:'num',show:a=>brandQ(a)&&pays(a),text:['How much does the brand pay us for this sample?','Wie viel zahlt die Brand uns für dieses Sample?'],
  help:['Net amount. If the brand covers only part of the value, enter that part.','Nettobetrag. Wenn die Brand nur einen Teil übernimmt, diesen Teil eingeben.']},
 {id:'cnType',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&a.who==='credit',text:['What is the credit note for?','Wofür ist die Gutschrift?'],
  opts:[{v:'service',l:['Our marketing / seeding work','Unsere Marketing-/Seeding-Leistung'],d:['It pays us for sending products to media on the brand’s behalf','Sie vergütet, dass wir im Auftrag der Brand Produkte an Medien senden']},
        {v:'discount',l:['A discount on our purchases','Ein Nachlass auf unsere Einkäufe'],d:['e.g. marketing allowance or price reduction on goods we bought','z. B. Werbekostenzuschuss oder Preisnachlass auf gekaufte Ware']},
        {v:'unclear',l:['Not clear','Unklar']}]},
 {id:'brandloc',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&pays(a),text:['Where is the brand company based?','Wo sitzt die Brand-Gesellschaft?'],
  help:['The company on our invoice or on the credit note – check the address on the document.','Die Gesellschaft auf unserer Rechnung bzw. der Gutschrift – Adresse auf dem Dokument prüfen.'],opts:locOpts},
 {id:'vatid',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&DE_(a)&&svc(a)&&a.brandloc==='eu',text:['Has the brand given us a valid EU VAT number, and has it been checked?','Hat die Brand eine gültige EU-USt-IdNr. angegeben, und wurde sie geprüft?'],
  help:['Finance checks VAT numbers via the EU VIES service.','Finance prüft USt-IdNrn. über das EU-VIES-System.'],opts:YN},
 {id:'proof',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&DE_(a)&&svc(a)&&a.brandloc==='noneu',text:['Do we have proof that the brand is a company?','Haben wir einen Nachweis, dass die Brand ein Unternehmen ist?'],
  help:['e.g. business registration or tax certificate – usually once per brand.','z. B. Handelsregisterauszug oder Steuerbescheinigung – meist einmal pro Brand.'],opts:YN},
 {id:'origin',side:['Brand side','Brand-Seite'],show:a=>brandQ(a)&&a.who==='free',text:['Where was the free product shipped to us from?','Von wo wurde das kostenlose Produkt an uns versendet?'],
  opts:a=>UK_(a)?[{v:'home',l:['Within the UK','Innerhalb UK']},{v:'noneu',l:['From outside the UK','Von außerhalb UK'],d:['Goes through customs','Geht durch den Zoll']}]
                :[{v:'home',l:['Germany','Deutschland']},{v:'eu',l:['Another EU country','Anderes EU-Land']},{v:'noneu',l:['Outside the EU','Außerhalb der EU'],d:['e.g. China or Taiwan – goes through customs','z. B. China oder Taiwan – geht durch den Zoll']}]},

 {id:'rloc',side:['Recipient side','Empfänger-Seite'],show:a=>OK_(a)&&ext(a),text:a=>a.rtype==='agency'?['Where is the agency based?','Wo sitzt die Agentur?']:['Where is the recipient based?','Wo sitzt der Empfänger?'],opts:locOpts},
 {id:'paid',side:['Recipient side','Empfänger-Seite'],show:extGo,text:['Do we also pay a fee?','Zahlen wir zusätzlich ein Honorar?'],help:['A paid media deal.','Ein bezahlter Media-Deal.'],opts:YN},
 {id:'ret',side:['Recipient side','Empfänger-Seite'],show:a=>extGo(a)&&!!a.paid,text:['Will the product come back?','Kommt das Produkt zurück?'],
  opts:[{v:'yes',l:['Yes – it’s a loan with a return date','Ja – Leihe mit Rückgabedatum']},{v:'no',l:['No – they keep it','Nein – sie behalten es']}]},
 {id:'counter',side:['Recipient side','Empfänger-Seite'],show:a=>extGo(a)&&a.paid==='no'&&a.ret==='no',text:['Has the recipient agreed in advance to do something for us in return?','Hat der Empfänger vorab eine Gegenleistung zugesagt?'],
  help:['Only counts if agreed before shipping, ideally in writing.','Zählt nur, wenn vor dem Versand vereinbart, idealerweise schriftlich.'],
  opts:[{v:'yes',l:['Yes','Ja'],d:['e.g. video, posts, review, stream or mention','z. B. Video, Posts, Review, Stream oder Erwähnung']},{v:'no',l:['No – it’s a gift','Nein – es ist ein Geschenk']}]},
 {id:'rvat',side:['Recipient side','Empfänger-Seite'],show:a=>extGo(a)&&a.rloc==='home'&&a.ret==='no'&&(a.paid==='yes'||a.counter==='yes'),
  text:['Does the recipient charge VAT on their invoices?','Weist der Empfänger auf seinen Rechnungen USt aus?'],
  help:['Ask them. Small businesses and private persons don’t.','Nachfragen. Kleinunternehmer und Privatpersonen tun das nicht.'],
  opts:[{v:'yes',l:['Yes, VAT-registered','Ja, umsatzsteuerlich registriert']},{v:'no',l:['No – small business or private person','Nein – Kleinunternehmer oder Privatperson']},{v:'unknown',l:['I don’t know','Weiß ich nicht']}]},
 {id:'rvatid',side:['Recipient side','Empfänger-Seite'],show:a=>extGo(a)&&DE_(a)&&a.rloc==='eu'&&a.ret==='no'&&(a.paid==='yes'||a.counter==='yes'),
  text:['Does the recipient have a valid EU VAT number?','Hat der Empfänger eine gültige EU-USt-IdNr.?'],opts:YN},
 {id:'others',side:['Recipient side','Empfänger-Seite'],type:'num',zero:true,show:a=>extGo(a)&&a.paid==='no'&&a.ret==='no'&&a.counter==='no',
  text:['What have we already given this person as gifts this year?','Was hat diese Person dieses Jahr bereits als Geschenk erhalten?'],
  help:['Net value of other gifts this calendar year (UK: last 12 months). Enter 0 if none.','Nettowert anderer Geschenke im Kalenderjahr (UK: letzte 12 Monate). 0, wenn keine.']},
 {id:'cloc',side:['Recipient side','Empfänger-Seite'],show:a=>OK_(a)&&a.rtype==='consumer',text:['Where does the prize go?','Wohin geht der Preis?'],opts:locOpts},
 {id:'okind',side:['Recipient side','Empfänger-Seite'],show:a=>OK_(a)&&a.rtype==='own',text:['How do we use it?','Wie nutzen wir es?'],
  opts:[{v:'demo',l:['Demo, display, test or event unit','Demo-, Ausstellungs-, Test- oder Messegerät'],d:['Stays ours','Bleibt in unserem Eigentum']},
        {v:'build',l:['Built into a system we sell','In ein verkauftes System verbaut']},
        {v:'used',l:['Used up or destroyed in testing','Im Test verbraucht oder zerstört']}]},

/* ---------- flow ---------- */
const S={a:{},i:0,hist:[],done:false};
const app=document.getElementById('app'), bar=document.getElementById('bar');
const vis=q=>!q.show||q.show(S.a);
const nextIdx=f=>{ for(let k=f+1;k<Q.length;k++) if(vis(Q[k])) return k; return -1; };
const qText=q=>t(typeof q.text==='function'?q.text(S.a):q.text);
const qOpts=q=>typeof q.opts==='function'?q.opts(S.a):q.opts;

function header(){
  document.getElementById('h1').textContent=L('Sample tax check','Sample-Steuercheck');
  document.getElementById('sub').textContent=L('Answer a few questions about a sample. You’ll see whether to invoice, with or without VAT, and what it costs each side.','Beantworte ein paar Fragen zum Sample. Du siehst, ob mit oder ohne USt fakturiert wird und was es jede Seite kostet.');
  document.documentElement.lang=LANG;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ LANG=b.dataset.l; save(); render(); });

function render(){
  header();
  CUR=S.a.entity==='uk'?'GBP':'EUR';
  if(S.done){ renderResult(); return; }
  const q=Q[S.i];
  const remaining=Q.slice(S.i).filter(vis).length;
  bar.style.width=Math.min(95,Math.round(S.hist.length/(S.hist.length+remaining)*100))+'%';
  let h=`<div class="qcard"><p class="side">${t(q.side)}</p><h2>${qText(q)}</h2>${q.help?`<p class="help">${t(q.help)}</p>`:''}`;
  if(q.type==='num'){
    let d=S.a[q.id]; if(d===undefined&&q.id==='fee') d=S.a.value; if(d===undefined&&q.zero) d=0;
    h+=`<div class="numrow"><label><span aria-hidden="true">${CUR}</span><input id="numin" inputmode="decimal" aria-label="${qText(q)}" value="${d!==undefined?d:''}" placeholder="0"></label>
        <button class="btn" id="numok">${L('Continue','Weiter')}</button></div><div class="err" id="err"></div>`;
  } else {
    h+=`<div class="opts">`+qOpts(q).map(o=>`<button class="opt${S.a[q.id]===o.v?' sel':''}" data-v="${o.v}"><strong>${t(o.l)}</strong>${o.d?`<span>${t(o.d)}</span>`:''}</button>`).join('')+`</div>`;
  }
  h+=`</div><div class="nav"><button class="btn ghost" id="back" ${S.hist.length?'':'disabled'}>${L('Back','Zurück')}</button>${S.hist.length?`<button class="btn ghost" id="restart">${L('Start over','Neu starten')}</button>`:''}</div>`;
  app.innerHTML=h;
  if(q.type==='num'){
    const inp=document.getElementById('numin'); inp.focus();
    const go=()=>{ const v=num(inp.value); const ok=v>0||(q.zero&&inp.value.trim()!==''&&v===0);
      if(!ok){ document.getElementById('err').textContent=q.zero?L('Enter an amount (0 if none).','Betrag eingeben (0, wenn keiner).'):L('Enter an amount greater than 0.','Betrag größer 0 eingeben.'); return; }
      answer(q,v); };
    document.getElementById('numok').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  } else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,b.dataset.v));
  const bk=document.getElementById('back'); if(bk) bk.onclick=goBack;
  const rs=document.getElementById('restart'); if(rs) rs.onclick=restart;
}
function answer(q,v){
  const idx=Q.indexOf(q); Q.slice(idx+1).forEach(x=>delete S.a[x.id]);
  S.a[q.id]=v; S.hist.push(idx);
  const n=nextIdx(idx); if(n<0) S.done=true; else S.i=n;
  render(); window.scrollTo(0,0);
}
function goBack(){ if(!S.hist.length) return; S.done=false; S.i=S.hist.pop(); render(); }
function restart(){ S.a={}; S.doc={}; S.i=0; S.hist=[]; S.done=false; render(); window.scrollTo(0,0); }

/* ---------- decision logic ---------- */
function compute(a){

    creditDisc:`Please reference on the credit note:\n- “Price reduction / marketing allowance on purchases”\n- Campaign / samples: [ ]\n- Related invoice numbers (if any)\n- VAT amount, where the original purchase carried VAT`,

    loan:`Loan note\n- Product / SKU / serial number: [ ]\n- Value: ${fmt(V)} (net)\n- Loan period: until [date] – return label enclosed\n- Remains property of [PGG company]\n- If not returned by [date], we will invoice the product at ${fmt(V)} plus VAT`,
    gift:`Gift list – required fields\n- Recipient name and address\n- Date, product, SKU\n- Net value: ${fmt(V)}\n- Reason / occasion\n- Running total for this recipient this year`,

  }
  if(!C.facts) C.facts=[[L('VAT','USt'),C.vat||'–'],[L('Value','Wert'),fmt(V)]];
  R.blocks.push(C);

  /* economics */
  const freeIncome=(!uk&&free&&E.given&&a.rtype!=='ic')?V:0;  // § 6 Abs. 4 EStG
  const expense=E.given?(a.rtype==='ic'?V:(free?(uk?0:V):V)):0;
  const vat=E.vatUnknown?0:E.vat;
  const pre=E.income-E.product-vat;
  const taxable=E.income+freeIncome-(E.deductible?expense+vat:0);
  const tax=TAX*taxable;
  R.econ={...E, pre, tax, after:pre-tax, brand:brandEcon, rec:recEcon, freeIncome, adhoc:a.confirm==='adhoc', afterNo:(pre-F)-(tax-TAX*F)};
  return R;
}

      ${X.note?`<div class="inv"><small>${L('Invoice text','Rechnungstext')}</small>${X.note}</div>`:''}
      ${X.euro?`<div class="euro">${L('1 EUR invoice?','1-EUR-Rechnung?')} ${X.euro}</div>`:''}
      ${X.legal&&X.legal.length?`<details><summary>${L('Legal basis','Rechtsgrundlagen')}</summary><ul>${X.legal.map(l=>`<li>${l}</li>`).join('')}</ul></details>`:''}</section>`;
  });
  h+=`<section class="block"><h3>${L('Economics','Wirtschaftlichkeit')}</h3><div class="tbl-wrap"><table class="econ">`+
    econRows(R).map(r=>`<tr class="${r[2]||''}"><td>${r[0]}</td><td>${typeof r[1]==='number'?fmt(r[1]):r[1]}</td></tr>`).join('')+
    `</table></div><div class="cols"><div class="party"><b>${L('Brand','Brand')}</b>${E.brand}</div><div class="party"><b>${a.rtype==='ic'?L('Receiving company','Empfangende Gesellschaft'):L('Recipient','Empfänger')}</b>${E.rec}</div></div></section>`;
  if(R.tpl.length){
    h+=`<section class="block"><h3>${L('Templates','Vorlagen')}</h3><p class="help">${L('Business documents in English – copy and adjust.','Geschäftsdokumente auf Englisch – kopieren und anpassen.')}</p>`;
    R.tpl.forEach((x,i)=>h+=`<div class="tpl"><div class="tpl-h"><b>${x.title}</b><button class="btn ghost small" data-tpl="${i}">${L('Copy','Kopieren')}</button></div><pre>${esc(x.text)}</pre></div>`);
    h+=`</section>`;
  }
  h+=`<section class="block"><h3>${L('Documentation','Dokumentation')}</h3><p class="help">${L('Optional – these details go into the Excel file and the copied summary.','Optional – diese Angaben landen in der Excel-Datei und in der kopierten Zusammenfassung.')}</p><div class="docgrid">`+
    docFields().map(([k,l])=>`<label><span>${l}</span><input data-doc="${k}" value="${esc(S.doc[k]||(k==='date'?today():''))}"></label>`).join('')+
    `</div><div class="nav">${DL?`<button class="btn" id="xlsx">${L('Download Excel','Excel herunterladen')}</button>`:''}<button class="btn ${DL?'ghost':''}" id="copy">${L('Copy for Excel','Für Excel kopieren')}</button><span class="copied" id="copied" role="status"></span></div></section>`;
  let n=1;
  h+=`<section class="final"><h3>${L('Your to-do list','Deine To-dos')}</h3>`+todoGroups(R).map(g=>`<div class="tg${g.stop?' stop':''}"><p class="tgh">${g.h}</p><ul>`+g.items.map(it=>`<li><label><input type="checkbox"><span class="n">${n++}</span><span>${it}</span></label></li>`).join('')+`</ul></div>`).join('')+`</section>`;
  h+=`<section class="block"><details><summary>${L('Your answers','Deine Antworten')}</summary><ul class="answers">${Q.filter(q=>vis(q)&&S.a[q.id]!==undefined).map(q=>`<li><span>${qText(q)}</span><span>${labelOf(q)}</span></li>`).join('')}</ul></details></section>`;
  h+=`<div class="nav"><button class="btn ghost" id="back">${L('Back','Zurück')}</button><button class="btn ghost" id="restart">${L('Start over','Neu starten')}</button></div>
  <p class="foot">${L('Covers German and UK PGG companies. Not a replacement for tax advice – if in doubt, ask Group Finance.','Deckt deutsche und UK-Gesellschaften der PGG ab. Ersetzt keine Steuerberatung – im Zweifel Group Finance fragen.')}</p>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=goBack; document.getElementById('restart').onclick=restart;
  const msg=document.getElementById('copied');
  app.querySelectorAll('[data-doc]').forEach(i=>i.oninput=()=>{ S.doc[i.dataset.doc]=i.value; });
  document.getElementById('copy').onclick=()=>copyText(tsv(R),msg);
  const xb=document.getElementById('xlsx'); if(xb) xb.onclick=()=>downloadXlsx(R,msg);
  app.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>copyText(R.tpl[+b.dataset.tpl].text,msg));
}
function copyText(text,el){
  const done=()=>{ el.textContent=L('Copied','Kopiert'); setTimeout(()=>el.textContent='',2000); };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ el.textContent=L('Copy failed','Kopieren fehlgeschlagen'); } document.body.removeChild(ta); };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fb); else fb(); }catch(e){ fb(); }
}
render();
})();
</script>
